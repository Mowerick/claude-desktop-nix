name: update

# Nothing upstream signals a new release (see update.sh), so poll daily and
# open a PR when the pins move.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PACKAGE_DIR: pkgs/by-name/cl/claude-desktop
  # update.sh's nix-shell shebang resolves its own dependencies against this.
  NIX_PATH: nixpkgs=channel:nixos-unstable

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Run exactly as a nixpkgs maintainer would: from the repo root, through
      # the shebang.
      - name: Bump pinned versions
        run: ./$PACKAGE_DIR/update.sh

      # sources.json's schema is read here rather than reported by the script,
      # which stays a plain nixpkgs updater.
      - name: Describe the resulting pins
        id: pins
        run: |
          summary=$(jq -r '[.systems | to_entries[] | "\(.value.debArch) \(.value.version)"] | join(", ")' \
            "$PACKAGE_DIR/sources.json")
          echo "summary=$summary" >>"$GITHUB_OUTPUT"

      # No-ops when update.sh left the tree clean.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-claude-desktop
          commit-message: "chore: update claude-desktop (${{ steps.pins.outputs.summary }})"
          title: "chore: update claude-desktop (${{ steps.pins.outputs.summary }})"
          body: |
            Automated bump from Anthropic's apt `Packages` indexes.

            Pins: ${{ steps.pins.outputs.summary }}

            The systems are pinned independently, so only the one(s) with a new
            upstream release will show a diff.
          delete-branch: true
