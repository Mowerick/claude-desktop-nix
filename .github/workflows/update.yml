name: update

# Nothing upstream signals a new release (see update.sh), so poll daily and
# open a PR when the pins move.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PACKAGE_DIR: pkgs/by-name/cl/claude-desktop

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only needed for `nix hash convert`; jq is preinstalled on runners.
      - uses: DeterminateSystems/nix-installer-action@main

      # Reports the resulting pins via $GITHUB_OUTPUT; only it knows sources.json's schema.
      - name: Bump pinned versions
        id: bump
        # Invoked through bash so the nix-shell shebang is bypassed: runners
        # already have curl/jq/git, and no <nixpkgs> channel is configured.
        run: bash ./$PACKAGE_DIR/update.sh

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-claude-desktop
          commit-message: "chore: update claude-desktop (${{ steps.bump.outputs.summary }})"
          title: "chore: update claude-desktop (${{ steps.bump.outputs.summary }})"
          body: |
            Automated bump from Anthropic's apt `Packages` indexes.

            Pins: ${{ steps.bump.outputs.summary }}

            The systems are pinned independently, so only the one(s) with a new
            upstream release will show a diff.
          delete-branch: true
